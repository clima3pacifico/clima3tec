<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clima 3 Tec · Administración</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b2545"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="estilos.css"></head>
<body class="marca"><header><div class="marca-h"><span class="logo-badge"><img src="logo_clima3.svg" alt="Clima 3"></span><span class="tec">TEC</span><span class="sub">Coordinación · Servicio Carrier</span><span class="demo">DEMO</span></div><button class="salir" onclick="salir()">Salir</button></header><main>
<nav class="tabs" id="tabs"></nav><section id="vista"></section></main>
<script src="comun.js"></script><script>
if(!S.t)location='/';
const TABS=[['panel','Panel'],['tickets','Tickets'],['nuevo','Nuevo ticket'],['expediente','Expedientes'],['checklists','Checklists'],['parametros','Parámetros'],['tecnicos','Técnicos'],['config','Configuración'],['auditoria','Auditoría']];
let CAT=null,TAB='panel',F={},DET=null;
tabs.innerHTML=TABS.map(([k,v])=>`<button data-t="${k}">${v}</button>`).join('')+'<button onclick="location=\'admin-bolsa.html\'">Bolsa (anterior)</button>';
tabs.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>ir(b.dataset.t));
async function ir(t,arg){TAB=t;tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));CAT=await api('/api/catalogos');$('#vista').innerHTML='<div class="card">Cargando…</div>';try{await V[t](arg)}catch(e){$('#vista').innerHTML=`<div class="card">${esc(e.message)}</div>`}scrollTo(0,0)}
const opt=(o,sel,vacio)=>(vacio?`<option value="">${vacio}</option>`:'')+Object.entries(o).map(([k,v])=>`<option value="${k}" ${String(sel)===String(k)?'selected':''}>${esc(v)}</option>`).join('');
const tecOpts=(sel,vacio='Sin asignar')=>`<option value="">${vacio}</option>`+CAT.tecnicos.filter(t=>t.activo).map(t=>`<option value="${t.id}" ${+sel===t.id?'selected':''}>${esc(t.nombre)}</option>`).join('');
const qs=o=>Object.entries(o).filter(([,v])=>v).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
const dur=m=>m==null?'—':m<60?`${m} min`:m<1440?`${Math.floor(m/60)} h ${m%60} min`:`${(m/1440).toFixed(1)} días`;
function filtrosHTML(){return `<div class="card"><div class="filtros">
 <div><label>Desde</label><input type="date" id="f_desde" value="${F.desde||''}"></div><div><label>Hasta</label><input type="date" id="f_hasta" value="${F.hasta||''}"></div>
 <div><label>Técnico</label><select id="f_tecnico">${tecOpts(F.tecnico,'Todos')}</select></div><div><label>Cliente</label><input id="f_cliente" placeholder="Nombre" value="${esc(F.cliente||'')}"></div>
 <div><label>Tipo de proyecto</label><select id="f_tipo_proyecto">${opt(CAT.TIPOS_PROY,F.tipo_proyecto,'Todos')}</select></div><div><label>Estatus</label><select id="f_estado">${opt(CAT.ESTADOS,F.estado,'Todos')}</select></div>
 <div style="display:flex;gap:6px"><button onclick="aplicar()" style="flex:1">Filtrar</button><button class="sec" onclick="F={};ir(TAB)">Limpiar</button></div></div></div>`}
function aplicar(){F={};['desde','hasta','tecnico','cliente','tipo_proyecto','estado'].forEach(k=>F[k]=$('#f_'+k).value.trim());ir(TAB)}
const tablaTickets=l=>`<div class="card tabla-scroll"><table><tr><th>Ticket</th><th>Cliente</th><th>Proyecto</th><th>Técnico</th><th>Programado</th><th>Estatus</th><th>Avance</th></tr>
 ${l.map(t=>`<tr class="click" onclick="ir('tickets',${t.id})"><td><b>${esc(t.folio)}</b>${t.cliente_carrier?' <span class="badge-carrier">C</span>':''}</td><td>${esc(t.cliente_nombre)}<br><small style="color:var(--muted)">${esc(t.ciudad||'')}</small></td><td>${esc(t.tipo_proyecto_txt)}</td><td>${esc(t.tecnico||'—')}</td><td>${fechaL(t.fecha_programada)}</td><td>${chipEstado(t.estado,t.estado_txt)}</td><td>${t.chk_hechas}/${t.chk_total} · ${t.fotos} 📷</td></tr>`).join('')||'<tr><td colspan="7">Sin tickets con esos filtros.</td></tr>'}</table></div>`;
const barras=(tit,l)=>{const mx=Math.max(1,...l.map(x=>x.n));return `<div class="card"><h4>${tit}</h4><div class="barras">${l.map(x=>`<div><span class="l" title="${esc(x.k)}">${esc(x.k)}</span><span class="b" style="width:${45*x.n/mx}%"></span><b>${x.n}</b></div>`).join('')||'<small>Sin datos</small>'}</div></div>`};
const V={
async panel(){const d=await api('/api/dashboard?'+qs(F));const g=d.grupos;
 const k=(n,t,e)=>`<div class="kpi" onclick="F.estado='${e}';ir('tickets')"><b>${n}</b><small>${t}</small></div>`;
 $('#vista').innerHTML=filtrosHTML()+`<div class="kpis">${k(g.pendientes,'Tickets pendientes (nuevos)','nuevo')}${k(g.asignados,'Asignados','asignado')}${k(g.ejecucion,'En ejecución','ejecucion')}${k(g.suspendidos,'Suspendidos','suspendido')}
 ${k(g.terminados,'Terminados','terminado')}${k(g.revision,'Pendientes de revisión','revision')}${k(g.cerrados,'Cerrados','cerrado')}
 <div class="kpi" style="border-color:var(--orange)"><b>${dur(d.tiempo_atencion_min)}</b><small>Tiempo promedio de atención (llegada → fin)</small></div>
 <div class="kpi" style="border-color:var(--orange)"><b>${dur(d.tiempo_respuesta_min)}</b><small>Tiempo promedio de respuesta (alta → llegada)</small></div></div>
 <div class="grid g2">${barras('Tickets por técnico',d.por_tecnico)}${barras('Tickets por tipo de proyecto',d.por_tipo_proyecto)}${barras('Tickets por tipo de servicio',d.por_tipo_servicio)}${barras('Servicios por cliente',d.por_cliente)}</div>
 <div class="card"><h4>Tickets por estatus</h4><div style="display:flex;flex-wrap:wrap;gap:6px">${Object.entries(d.por_estado).map(([e,n])=>`${chipEstado(e,CAT.ESTADOS[e]+': '+n)}`).join('')}</div></div>
 <h3 style="margin:8px 2px">Historial de servicios (${d.total})</h3>${tablaTickets(d.tickets)}`},
async tickets(id){if(id)return detalle(id);const l=await api('/api/tickets?'+qs(F));$('#vista').innerHTML=filtrosHTML()+`<div class="acciones"><button onclick="ir('nuevo')">+ Nuevo ticket</button></div>`+tablaTickets(l)},
async nuevo(edit){formTicket(edit)},
async expediente(id){if(id)return expediente(id);$('#vista').innerHTML=`<div class="card"><h3>Expediente de clientes y equipos</h3><div class="grid g2"><div><label>Buscar cliente</label><input id="ex_q" placeholder="Nombre del cliente o número de serie" oninput="buscarClientes()"></div>
 <div><label>Buscar equipo por número de serie</label><div style="display:flex;gap:6px"><input id="ex_s" placeholder="Ej. DEMO-EVA-3003"><button class="sec" onclick="buscarSerie()">Buscar</button></div></div></div><div id="ex_res"></div></div><div id="ex_lista"></div>`;buscarClientes()},
async checklists(tp){tp=tp||'instalacion';const l=CAT.plantillas.filter(p=>p.tipo_proyecto===tp);
 $('#vista').innerHTML=`<div class="card"><h3>Checklists configurables</h3><p style="color:var(--muted);font-size:13.5px;margin-top:0">Agrega, modifica, ordena o elimina actividades. Los tickets nuevos usan esta lista; los tickets existentes conservan su checklist.</p>
 <nav class="tabs">${Object.entries(CAT.TIPOS_PROY).map(([k,v])=>`<button class="${k===tp?'on':''}" onclick="ir('checklists','${k}')">${esc(v)}</button>`).join('')}</nav>
 <ul class="lista-plant">${l.map((p,i)=>`<li><b style="width:24px">${i+1}</b><input value="${esc(p.actividad)}" onchange="plant(${p.id},{actividad:this.value})"><button class="chico sec" onclick="plant(${p.id},{mover:-1},'${tp}')">↑</button><button class="chico sec" onclick="plant(${p.id},{mover:1},'${tp}')">↓</button><button class="chico peligro" onclick="borrarPlant(${p.id},'${tp}')">✕</button></li>`).join('')}</ul>
 <div style="display:flex;gap:6px;margin-top:12px"><input id="np" placeholder="Nueva actividad"><button onclick="nuevaPlant('${tp}')">Agregar</button></div></div>`},
async parametros(){$('#vista').innerHTML=`<div class="card"><h3>Parámetros de operación</h3><p style="color:var(--muted);font-size:13.5px;margin-top:0">Campos que ve el técnico. Ninguno es obligatorio; el técnico también puede agregar otros en el servicio.</p>
 <ul class="lista-plant">${CAT.parametros.map(p=>`<li><input value="${esc(p.nombre)}" onchange="api('/api/parametros-def/${p.id}',{method:'PUT',body:{nombre:this.value}}).then(()=>toast('Guardado'))"><input style="max-width:110px" placeholder="Unidad" value="${esc(p.unidad)}" onchange="api('/api/parametros-def/${p.id}',{method:'PUT',body:{unidad:this.value}}).then(()=>toast('Guardado'))"><button class="chico peligro" onclick="if(confirm('¿Eliminar?'))api('/api/parametros-def/${p.id}',{method:'DELETE'}).then(()=>ir('parametros'))">✕</button></li>`).join('')}</ul>
 <div style="display:flex;gap:6px;margin-top:12px"><input id="pn" placeholder="Nuevo parámetro"><input id="pu" placeholder="Unidad" style="max-width:110px"><button onclick="api('/api/parametros-def',{method:'POST',body:{nombre:pn.value,unidad:pu.value}}).then(()=>ir('parametros')).catch(e=>toast(e.message))">Agregar</button></div></div>`},
async tecnicos(){const l=await api('/api/tecnicos');$('#vista').innerHTML=`<div class="card"><h3>Alta de técnico</h3><div class="grid g2"><div><label>Nombre</label><input id="t_nombre"></div><div><label>Teléfono</label><input id="t_tel"></div><div><label>Usuario</label><input id="t_usuario" autocapitalize="none"></div><div><label>Contraseña inicial</label><input id="t_pass"></div></div><button onclick="altaTec()">Dar de alta</button></div>
 <div class="card tabla-scroll"><table><tr><th>Nombre</th><th>Usuario</th><th>Teléfono</th><th>Estado</th><th></th></tr>${l.map(t=>`<tr><td>${esc(t.nombre)}</td><td>${esc(t.usuario)}</td><td>${esc(t.telefono)}</td><td>${t.activo?'Activo':'Suspendido'}</td><td><button class="chico ${t.activo?'peligro':''}" onclick="api('/api/tecnicos/${t.id}',{method:'PATCH',body:{activo:${t.activo?0:1}}}).then(()=>ir('tecnicos'))">${t.activo?'Suspender':'Reactivar'}</button></td></tr>`).join('')}</table></div>`},
async config(){const [c,tc]=await Promise.all([api('/api/config'),api('/api/tecnico-carrier')]);
 $('#vista').innerHTML=`<div class="card"><h3>Técnico Carrier autorizado</h3><p style="font-size:13.5px;color:var(--muted);margin-top:0">Se usa en el bloque <b>TÉCNICO CARRIER</b> del Formato Reporte Electrónico 1.1 (clientes Carrier). El técnico que hizo el servicio sigue firmando en la app y su firma va en el reporte interno de Clima 3.</p>
 ${!tc.firma_img?'<div class="aviso rojo"><b>Falta la firma del técnico Carrier.</b> El formato Carrier saldrá con la línea de firma en blanco hasta que subas o dibujes la firma.</div>':''}
 ${!tc.nombre_img?'<div class="aviso">No hay imagen del nombre manuscrito; el formato mostrará el nombre escrito a máquina.</div>':''}
 <label>Nombre</label><div style="display:flex;gap:6px"><input id="tc_nom" value="${esc(tc.nombre)}"><button onclick="api('/api/tecnico-carrier',{method:'PUT',body:{nombre:tc_nom.value}}).then(()=>toast('Guardado'))">Guardar</button></div>
 <div class="grid g2">${['nombre_img','firma_img'].map(k=>`<div class="card" style="box-shadow:none"><h4>${k==='nombre_img'?'Nombre manuscrito':'Firma'}</h4>
 ${tc[k]?`<img src="${tc[k]}" style="max-width:100%;max-height:70px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px"><br><small style="color:var(--muted)">Origen: ${esc(tc[k.replace('img','origen')])}</small>`:'<p style="color:#b42318;font-weight:700">Sin imagen</p>'}
 <label style="display:block;margin-top:8px">Subir imagen (PNG o JPG)</label><input type="file" accept="image/png,image/jpeg" onchange="subirTC('${k}',this)">
 <label>O dibujarla en pantalla</label><canvas class="pad" id="pad_${k}" style="height:110px"></canvas><div class="acciones"><button class="chico sec" onclick="PADS['${k}'].limpiar()">Borrar</button><button class="chico" onclick="guardarPadTC('${k}')">Guardar dibujo</button>${tc[k.replace('img','origen')]==='subida por administrador'?`<button class="chico peligro" onclick="if(confirm('¿Quitar la imagen subida?'))api('/api/tecnico-carrier',{method:'PUT',body:{${k}:null}}).then(()=>ir('config'))">Quitar subida</button>`:''}</div></div>`).join('')}</div></div>
 <div class="card"><h3>Colores institucionales</h3><div class="grid g2"><div><label>Color principal</label><input type="color" id="c1" style="height:46px;padding:4px" value="${c.color_primario}"></div><div><label>Color secundario</label><input type="color" id="c2" style="height:46px;padding:4px" value="${c.color_secundario}"></div></div>
 <button onclick="api('/api/config',{method:'PUT',body:{color_primario:c1.value,color_secundario:c2.value}}).then(()=>location.reload())">Guardar colores</button> <button class="sec" onclick="api('/api/config',{method:'PUT',body:{color_primario:'#0b2545',color_secundario:'#13a89e'}}).then(()=>location.reload())">Restablecer</button></div>
 <div class="card"><h3>Respaldo de información</h3><p style="font-size:13.5px;color:var(--muted);margin-top:0">Descarga una copia completa de la base de datos (tickets, checklists, historial y auditoría). Las fotos y firmas se guardan en el servidor.</p><button onclick="respaldo()">Descargar respaldo</button></div>`;
 window.PADS={nombre_img:PadFirma($('#pad_nombre_img')),firma_img:PadFirma($('#pad_firma_img'))}},
async auditoria(){const l=await api('/api/auditoria');$('#vista').innerHTML=`<div class="card tabla-scroll"><h3>Historial de modificaciones</h3><table><tr><th>Fecha</th><th>Usuario</th><th>Elemento</th><th>Acción</th><th>Detalle</th></tr>
 ${l.map(a=>`<tr><td style="white-space:nowrap">${fechaL(a.ts)}</td><td>${esc(a.usuario||'—')}</td><td>${a.folio?`<a href="#" onclick="ir('tickets',${a.entidad_id});return false">${esc(a.folio)}</a>`:esc(a.entidad)}</td><td>${esc(a.accion)}</td><td style="font-size:12px;max-width:420px;word-break:break-word">${esc(String(a.detalle).slice(0,300))}</td></tr>`).join('')}</table></div>`}};

// ---------- formulario de ticket (alta / edición) ----------
const CAMPOS=[['cliente_nombre','Nombre del cliente *'],['contacto','Nombre del contacto'],['telefono','Teléfono *'],['email','Correo electrónico'],['direccion','Dirección del servicio *'],['ciudad','Ciudad *'],['estado_geo','Estado'],['cp','Código postal'],['tienda','Tienda departamental (si aplica)'],
 ['modelo','Modelo del equipo (evaporadora)'],['serie','Número de serie (evaporadora)'],['modelo_cond','Modelo condensadora'],['serie_cond','Número de serie condensadora'],['fecha_compra','Fecha del ticket o comprobante de compra','date'],['folio_factura','Número de folio de facturación'],['centro_servicio','Centro de Servicio Carrier']];
async function formTicket(id){const t=id?await api('/api/tickets/'+id):{ciudad:'Hermosillo',estado_geo:'Sonora',centro_servicio:'Clima 3',cliente_carrier:1};const cl=await api('/api/clientes');window._CL=cl;
 $('#vista').innerHTML=`<div class="card"><h3>${id?'Editar ticket '+esc(t.folio):'Nuevo ticket de servicio'}</h3>
 ${!id?`<div class="aviso" style="background:#eef6ff;border-color:#cfe2fb;color:#1d4f8a">¿El equipo ya tuvo servicio? Busca por número de serie para recuperar sus datos.<div style="display:flex;gap:6px;margin-top:6px"><input id="bs" placeholder="Número de serie" style="margin:0"><button class="sec" onclick="recuperarSerie()">Recuperar</button></div><div id="bs_res"></div></div>`:''}
 <h4>Cliente y equipo</h4><div class="grid g2">${CAMPOS.map(([k,l,tp])=>`<div><label>${l}</label><input id="n_${k}" ${tp?`type="${tp}"`:''} ${k==='cliente_nombre'?'list="dl_cli" onchange="elegirCliente()"':''} value="${esc(t[k]||'')}"></div>`).join('')}</div>
 <datalist id="dl_cli">${cl.map(c=>`<option value="${esc(c.nombre)}">`).join('')}</datalist>
 <h4>Servicio</h4><div class="grid g2"><div><label>Fecha programada del servicio *</label><input type="datetime-local" id="n_fecha_programada" value="${esc((t.fecha_programada||'').slice(0,16))}"></div>
 <div><label>Tipo de proyecto * (carga el checklist)</label><select id="n_tipo_proyecto" onchange="previaChk()">${opt(CAT.TIPOS_PROY,t.tipo_proyecto,'Selecciona…')}</select></div>
 <div><label>Tipo de servicio *</label><select id="n_tipo_servicio" onchange="n_otro_w.hidden=this.value!=='otro';if(this.value==='garantia')n_cliente_carrier.checked=true">${opt({evaluacion:'Evaluación',instalacion:'Instalación',correctivo:'Correctivo',garantia:'Garantía',preventivo:'Mantenimiento preventivo',otro:'Otro'},t.tipo_servicio,'Selecciona…')}</select></div>
 <div id="n_otro_w" ${t.tipo_servicio==='otro'?'':'hidden'}><label>Describe "Otro"</label><input id="n_tipo_servicio_otro" value="${esc(t.tipo_servicio_otro||'')}"></div>
 <div><label>Técnico responsable</label><select id="n_tecnico_id">${tecOpts(t.tecnico_id)}</select></div>
 <div><label>Técnicos de apoyo</label><div>${CAT.tecnicos.filter(x=>x.activo).map(x=>`<label style="display:inline-flex;gap:6px;align-items:center;margin-right:12px;font-weight:500;color:var(--txt)"><input type="checkbox" class="n_apoyo" value="${x.id}" style="width:auto;margin:0" ${(t.apoyo_ids||[]).includes(x.id)?'checked':''}>${esc(x.nombre)}</label>`).join('')}</div></div>
 <div><label style="display:flex;gap:8px;align-items:center;font-size:15px;color:var(--navy)"><input type="checkbox" id="n_cliente_carrier" style="width:auto;margin:0" ${t.cliente_carrier?'checked':''}> Cliente Carrier (agrega el Formato Reporte Electrónico 1.1 al PDF)</label></div></div>
 <label>Observaciones iniciales</label><textarea id="n_obs_iniciales">${esc(t.obs_iniciales||'')}</textarea>
 ${id&&t.firma_hash?'<div class="aviso">Este ticket ya tiene firma del cliente. Si cambias datos del reporte se crea una nueva versión y queda registrado.</div>':''}
 <div id="previa"></div><button class="btn-grande" onclick="guardarTicket(${id||0})">${id?'GUARDAR CAMBIOS':'CREAR TICKET'}</button></div>`;previaChk()}
function previaChk(){const tp=$('#n_tipo_proyecto').value;$('#previa').innerHTML=tp?`<div class="card" style="box-shadow:none;background:#f5f8fb"><h4>Checklist que se cargará: ${esc(CAT.TIPOS_PROY[tp])}</h4><ol style="margin:0;padding-left:20px;font-size:13.5px">${CAT.plantillas.filter(p=>p.tipo_proyecto===tp).map(p=>`<li>${esc(p.actividad)}</li>`).join('')}</ol></div>`:''}
function elegirCliente(){const c=_CL.find(x=>x.nombre===$('#n_cliente_nombre').value);if(!c)return;['contacto','telefono','email','direccion','ciudad','estado_geo','cp'].forEach(k=>{if(c[k])$('#n_'+k).value=c[k]});toast('Datos del cliente cargados')}
async function recuperarSerie(){const r=await api('/api/equipos/buscar?serie='+encodeURIComponent(bs.value));if(!r.encontrado){bs_res.innerHTML='<p>No hay servicios previos con esa serie.</p>';return}
 Object.entries({...r.cliente,...r.equipo}).forEach(([k,v])=>{const el=$('#n_'+k);if(el&&v)el.value=v});
 bs_res.innerHTML=`<p style="margin:8px 0 0"><b>✓ Datos recuperados.</b> Servicios anteriores: ${r.servicios.map(s=>`${esc(s.folio)} (${esc(s.tipo_proyecto)}, ${esc(s.estado)})`).join(' · ')}</p>`}
async function guardarTicket(id){const b={};CAMPOS.forEach(([k])=>b[k]=$('#n_'+k).value.trim());['fecha_programada','tipo_proyecto','tipo_servicio','tipo_servicio_otro','tecnico_id','obs_iniciales'].forEach(k=>b[k]=$('#n_'+k).value);
 b.apoyo=[...document.querySelectorAll('.n_apoyo:checked')].map(x=>+x.value);b.cliente_carrier=$('#n_cliente_carrier').checked;
 try{if(id){const t=await api('/api/tickets/'+id);if(t.tipo_proyecto!==b.tipo_proyecto&&!confirm('Cambiar el tipo de proyecto reemplaza el checklist del ticket. ¿Continuar?'))return;await api('/api/tickets/'+id,{method:'PATCH',body:b});toast('Cambios guardados');ir('tickets',id)}
 else{const r=await api('/api/tickets',{method:'POST',body:b});toast('Ticket '+r.folio+' creado');ir('tickets',r.id)}}catch(e){toast(e.message)}}

// ---------- detalle ----------
async function detalle(id){const t=await api('/api/tickets/'+id);DET=t;const f=(l,v)=>`<div><label>${l}</label><div style="font-weight:600;margin-bottom:8px">${esc(v)||'—'}</div></div>`;
 const p=t.parametros||{},pv=p.valores||{};
 $('#vista').innerHTML=`<div class="acciones"><button class="sec chico" onclick="ir('tickets')">← Tickets</button></div>
 <div class="card"><div class="job top"><div><h3 style="margin:0">${esc(t.folio)} · ${esc(t.cliente_nombre)} ${t.cliente_carrier?'<span class="badge-carrier">CLIENTE CARRIER</span>':''}</h3><small style="color:var(--muted)">${esc(t.tipo_proyecto_txt)} · versión del reporte v${t.version}</small></div>${chipEstado(t.estado,t.estado_txt)}</div>
 ${t.estado==='revision'?`<div class="aviso">El técnico envió este servicio a revisión. Revisa fotos, checklist y firmas y autoriza el cierre.</div><div class="acciones"><button onclick="cambiar('cerrado','Cierre autorizado')">✓ Autorizar cierre</button><button class="peligro" onclick="devolver()">Devolver al técnico</button></div>`:''}
 ${t.firma_hash&&!t.firma_vigente?`<div class="aviso rojo">El reporte se modificó después de la firma del cliente (actual v${t.version}, firmado v${t.firma_version}). Ver versiones abajo.</div>`:''}
 <div class="acciones"><a class="boton" target="_blank" href="${pdfUrl(t.id)}">📄 PDF completo</a>${t.cliente_carrier?`<a class="boton" target="_blank" href="${pdfUrl(t.id,'carrier')}">Formato Carrier 1.1</a>`:''}<a class="boton" target="_blank" href="${pdfUrl(t.id,'clima3')}">Reporte Clima 3</a><a class="boton" target="_blank" href="${pdfUrl(t.id,'fotos')}">📷 Reporte fotográfico</a><a class="boton t" href="${pdfUrl(t.id,'',1)}">⬇️ Descargar</a>
 <button class="sec" onclick="compartir()">Compartir / correo</button><button class="sec" onclick="ir('nuevo',${t.id})" ${t.estado==='cerrado'?'disabled':''}>Editar</button></div>
 <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><select id="d_est" style="max-width:260px;margin:0">${opt(CAT.ESTADOS,t.estado)}</select><input id="d_nota" placeholder="Nota del cambio" style="max-width:300px;margin:0"><button class="chico" onclick="cambiar(d_est.value,d_nota.value)">Cambiar estatus</button></div></div>
 <div class="grid g2"><div class="card"><h4>Datos del ticket</h4><div class="grid g2">${f('Creado',fechaL(t.creado))}${f('Programado',fechaL(t.fecha_programada))}${f('Contacto',t.contacto)}${f('Teléfono',t.telefono)}${f('Correo',t.email)}${f('Dirección',[t.direccion,t.ciudad,t.estado_geo,t.cp].filter(Boolean).join(', '))}
 ${f('Tienda departamental',t.tienda)}${f('Fecha de compra',t.fecha_compra)}${f('Modelo / serie',[t.modelo,t.serie].filter(Boolean).join(' · '))}${f('Condensadora',[t.modelo_cond,t.serie_cond].filter(Boolean).join(' · '))}${f('Folio de facturación',t.folio_factura)}${f('Centro de servicio',t.centro_servicio)}
 ${f('Tipo de servicio',t.tipo_servicio_txt+(t.tipo_servicio==='otro'?': '+t.tipo_servicio_otro:''))}${f('Técnico responsable',t.tecnico)}${f('Técnicos de apoyo',t.apoyo_nombres.join(', '))}${f('Llegada',fechaL(t.llegada_ts))}</div>${f('Observaciones iniciales',t.obs_iniciales)}</div>
 <div class="card"><h4>Historial de estados</h4><div class="linea-tiempo">${t.historial.map(h=>`<div><b>${esc(CAT.ESTADOS[h.estado])}</b> · ${fechaL(h.ts)}<br><small style="color:var(--muted)">${esc(h.usuario||'')}${h.nota?' · '+esc(h.nota):''}${h.lat?` · <a target="_blank" href="https://maps.google.com/?q=${h.lat},${h.lng}">GPS</a>`:''}</small></div>`).join('')}</div></div></div>
 <div class="card"><h4>Reporte del servicio</h4><div class="grid g2">${f('Descripción de los trabajos',t.descripcion)}${f('Estado en que se deja el equipo',t.estado_equipo)}${f('Recomendaciones',t.recomendaciones)}${f('Resultado',t.resultado==='terminado'?'Trabajo terminado':t.resultado==='suspendido'?'Trabajo suspendido':'')}${f('Anexos',t.anexos)}${f('Comentarios del cliente',t.comentarios_cliente)}${f('Materiales',t.materiales)}${f('Comentarios del técnico',t.comentarios)}</div>
 <h4>Parámetros de operación</h4><div class="grid g3">${CAT.parametros.filter(x=>pv[x.id]).map(x=>f(x.nombre+(x.unidad?` (${x.unidad})`:''),pv[x.id])).join('')}${(p.extra||[]).filter(e=>e.nombre).map(e=>f(e.nombre,e.valor)).join('')||''}</div></div>
 <div class="card tabla-scroll"><h4>Checklist · ${esc(t.tipo_proyecto_txt)}</h4><table><tr><th>#</th><th>Actividad</th><th>Estado</th><th>Observación</th></tr>${t.checklist.map((c,i)=>`<tr><td>${i+1}</td><td>${esc(c.actividad)}</td><td><b>${esc(CAT.CHECK_ESTADOS[c.estado])}</b></td><td>${esc(c.observacion)}</td></tr>`).join('')}</table></div>
 <div class="card"><h4>Evidencia fotográfica (${t.fotos.length})</h4>${Object.entries(CAT.ETAPAS).map(([e,n])=>`<h4 style="color:var(--teal2);margin-top:10px">${n}</h4><div class="fotos-grid">${t.fotos.filter(x=>x.etapa===e).map(x=>`<div class="foto"><img src="${imgUrl(t.id,x.archivo)}" onclick="ver(this.src)"><div class="pie"><b>${esc(x.descripcion)||'Sin descripción'}</b><br><small>${fechaL(x.ts_captura)}</small></div></div>`).join('')||'<small>Sin fotos</small>'}</div>`).join('')}</div>
 <div class="grid g2"><div class="card"><h4>Firma del técnico · ${esc(t.tecnico)}</h4>${t.firma_tecnico?`<img src="${imgUrl(t.id,t.firma_tecnico)}" style="max-width:100%;height:100px;object-fit:contain"><br><small>${fechaL(t.firma_tecnico_ts)}</small>`:'Pendiente'}</div>
 <div class="card"><h4>Autorización del cliente</h4>${t.firma_cliente?`<img src="${imgUrl(t.id,t.firma_cliente)}" style="max-width:100%;height:100px;object-fit:contain"><br><b>${esc(t.cliente_firma_nombre)}</b> ${esc(t.cliente_firma_cargo||'')}<br><small>${fechaL(t.cliente_firma_ts)} · firmado sobre v${t.firma_version} · ${t.firma_vigente?'<b style="color:#0f7a4f">vigente</b>':'<b style="color:#b42318">no corresponde a la versión actual</b>'}</small>`:'Pendiente'}</div></div>
 <div class="card tabla-scroll"><h4>Versiones del reporte</h4><table><tr><th>Versión</th><th>Fecha</th><th>Usuario</th><th>Motivo</th><th>Huella</th><th>PDF</th></tr>${t.versiones.map(v=>`<tr><td>v${v.version}</td><td>${fechaL(v.ts)}</td><td>${esc(v.usuario||'')}</td><td>${esc(v.motivo)}</td><td style="font-size:11px">${esc((v.hash||'').slice(0,16))}${v.hash?'…':''}</td><td>${v.pdf?'Guardado':'—'}</td></tr>`).join('')||'<tr><td colspan="6">Sin versiones firmadas aún.</td></tr>'}</table></div>
 <div class="card tabla-scroll"><h4>Auditoría del ticket</h4><table>${(t.auditoria||[]).map(a=>`<tr><td style="white-space:nowrap">${fechaL(a.ts)}</td><td>${esc(a.usuario||'')}</td><td>${esc(a.accion)}</td><td style="font-size:12px;word-break:break-word">${esc(String(a.detalle).slice(0,240))}</td></tr>`).join('')}</table></div>`}
async function cambiar(e,nota){try{await api(`/api/tickets/${DET.id}/estado`,{method:'POST',body:{estado:e,nota}});toast('Estatus: '+CAT.ESTADOS[e]);detalle(DET.id)}catch(x){toast(x.message)}}
function devolver(){const n=prompt('Motivo para devolver al técnico:');if(n!==null)cambiar('ejecucion','Devuelto por administración: '+n)}
function ver(src){const v=document.createElement('div');v.className='visor';v.innerHTML=`<img src="${src}">`;v.onclick=()=>v.remove();document.body.append(v)}
async function compartir(){const t=DET,nombre=`${t.folio}.pdf`,txt=`Reporte de servicio ${t.folio} · ${t.cliente_nombre} · Clima 3, Centro de Servicio Autorizado Carrier`;
 try{const b=await (await fetch(pdfUrl(t.id))).blob(),file=new File([b],nombre,{type:'application/pdf'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:nombre,text:txt});return}
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nombre;a.click()}catch(e){if(e.name==='AbortError')return}
 location.href=`mailto:${encodeURIComponent(t.email||'')}?subject=${encodeURIComponent('Reporte de servicio '+t.folio)}&body=${encodeURIComponent(txt+'\n\nSe adjunta el reporte en PDF.')}`}

// ---------- expediente ----------
async function buscarClientes(){const l=await api('/api/clientes?q='+encodeURIComponent($('#ex_q')?.value||''));$('#ex_lista').innerHTML=`<div class="card tabla-scroll"><table><tr><th>Cliente</th><th>Contacto</th><th>Ciudad</th><th>Servicios</th><th>Último</th></tr>${l.map(c=>`<tr class="click" onclick="ir('expediente',${c.id})"><td><b>${esc(c.nombre)}</b></td><td>${esc(c.contacto||'')} ${esc(c.telefono||'')}</td><td>${esc(c.ciudad||'')}</td><td>${c.tickets}</td><td>${fechaL(c.ultimo,false)}</td></tr>`).join('')}</table></div>`}
async function buscarSerie(){const r=await api('/api/equipos/buscar?serie='+encodeURIComponent(ex_s.value));$('#ex_res').innerHTML=!r.encontrado?'<p>Sin servicios con esa serie.</p>':`<div class="card" style="box-shadow:none;background:#f5f8fb"><b>${esc(r.equipo.modelo)} · ${esc(r.equipo.serie)}</b> — ${esc(r.cliente.cliente_nombre)}<br>Compra: ${esc(r.equipo.fecha_compra||'—')} · ${esc(r.equipo.tienda||'')}
 <ul>${r.servicios.map(s=>`<li><a href="#" onclick="ir('tickets',${s.id});return false">${esc(s.folio)}</a> · ${fechaL(s.fecha,false)} · ${esc(s.tipo_proyecto)} · ${esc(s.estado)}${s.recomendaciones?' · <i>'+esc(s.recomendaciones)+'</i>':''}</li>`).join('')}</ul>${r.cliente.cliente_id?`<button class="chico" onclick="ir('expediente',${r.cliente.cliente_id})">Abrir expediente del cliente</button>`:''}</div>`}
async function expediente(id){const e=await api('/api/expediente/'+id),c=e.cliente;const ks=[['nombre','Nombre'],['contacto','Contacto'],['telefono','Teléfono'],['email','Correo'],['direccion','Dirección'],['ciudad','Ciudad'],['estado_geo','Estado'],['cp','C.P.']];
 $('#vista').innerHTML=`<div class="acciones"><button class="sec chico" onclick="ir('expediente')">← Expedientes</button></div>
 <div class="card"><h3>Expediente · ${esc(c.nombre)}</h3><div class="grid g2">${ks.map(([k,l])=>`<div><label>${l}</label><input id="c_${k}" value="${esc(c[k]||'')}"></div>`).join('')}</div><button class="chico" onclick="guardarCliente(${c.id})">Guardar datos del cliente</button></div>
 <div class="card tabla-scroll"><h4>Equipos (modelo y números de serie)</h4><table><tr><th>Serie</th><th>Modelo</th><th>Tipo</th><th>Compra</th><th>Servicios</th></tr>${e.equipos.map(q=>`<tr><td><b>${esc(q.serie)}</b></td><td>${esc(q.modelo||'')}</td><td>${esc(q.tipo)}</td><td>${esc(q.fecha_compra||'')} ${esc(q.tienda||'')}</td><td>${q.servicios.map(s=>`<a href="#" onclick="ir('tickets',${s.id});return false">${esc(s.folio)}</a> (${esc(s.tipo_proyecto)})`).join('<br>')}</td></tr>`).join('')||'<tr><td colspan="5">Sin equipos registrados</td></tr>'}</table></div>
 <div class="card"><h4>Recomendaciones y pendientes</h4><ul style="font-size:14px">${e.pendientes.map(p=>`<li><b>${esc(p.folio)}</b> (${fechaL(p.fecha,false)}): ${esc(p.texto)}</li>`).join('')||'<li>Sin pendientes</li>'}</ul></div>
 <div class="card tabla-scroll"><h4>Historial de tickets y reportes PDF</h4><table><tr><th>Ticket</th><th>Fecha</th><th>Proyecto</th><th>Diagnóstico / trabajos</th><th>Estatus</th><th>PDF</th></tr>${e.tickets.map(t=>`<tr><td><a href="#" onclick="ir('tickets',${t.id});return false"><b>${esc(t.folio)}</b></a></td><td>${fechaL(t.fecha_programada,false)}</td><td>${esc(t.tipo_proyecto_txt)}</td><td style="font-size:13px">${esc(t.descripcion||t.obs_iniciales||'')}</td><td>${chipEstado(t.estado,t.estado_txt)}</td><td><a target="_blank" href="${pdfUrl(t.id)}">Ver</a>${t.versiones.filter(v=>v.pdf).length?` · ${t.versiones.filter(v=>v.pdf).length} versión(es) guardada(s)`:''}</td></tr>`).join('')}</table></div>
 <div class="card"><h4>Fotografías históricas</h4><div class="fotos-grid">${e.tickets.flatMap(t=>t.fotos.map(x=>`<div class="foto"><img src="${imgUrl(t.id,x.archivo)}" onclick="ver(this.src)"><div class="pie"><b>${esc(t.folio)}</b> · ${esc(CAT.ETAPAS[x.etapa])}<br><small>${esc(x.descripcion)} · ${fechaL(x.ts_captura,false)}</small></div></div>`)).join('')||'<small>Sin fotos</small>'}</div></div>`}
async function guardarCliente(id){const b={};['nombre','contacto','telefono','email','direccion','ciudad','estado_geo','cp'].forEach(k=>b[k]=$('#c_'+k).value);await api('/api/clientes/'+id,{method:'PUT',body:b});toast('Cliente actualizado')}

// ---------- catálogos ----------
async function plant(id,b,tp){try{await api('/api/plantillas/'+id,{method:'PUT',body:b});if(tp)ir('checklists',tp);else toast('Actividad guardada')}catch(e){toast(e.message)}}
async function borrarPlant(id,tp){if(confirm('¿Eliminar esta actividad de la plantilla?')){await api('/api/plantillas/'+id,{method:'DELETE'});ir('checklists',tp)}}
async function nuevaPlant(tp){try{await api('/api/plantillas',{method:'POST',body:{tipo_proyecto:tp,actividad:np.value}});ir('checklists',tp)}catch(e){toast(e.message)}}
async function altaTec(){try{await api('/api/tecnicos',{method:'POST',body:{nombre:t_nombre.value,telefono:t_tel.value,usuario:t_usuario.value.trim().toLowerCase(),password:t_pass.value}});toast('Técnico dado de alta');ir('tecnicos')}catch(e){toast(e.message)}}
async function subirTC(k,inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{await api('/api/tecnico-carrier',{method:'PUT',body:{[k]:r.result}});toast('Imagen guardada');ir('config')}catch(e){toast(e.message)}};r.readAsDataURL(f)}
async function guardarPadTC(k){if(PADS[k].vacio())return toast('Dibuja primero');await api('/api/tecnico-carrier',{method:'PUT',body:{[k]:PADS[k].png()}});toast('Guardado');ir('config')}
async function respaldo(){const r=await fetch('/api/respaldo',{headers:{Authorization:'Bearer '+S.t}});if(!r.ok)return toast('No se pudo generar el respaldo');const a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download='clima3tec-respaldo.db';a.click()}
ir('panel');vivo(d=>{if(d.tipo==='ticket'&&TAB==='tickets'&&DET&&DET.id===d.id&&!document.activeElement.matches('input,textarea,select'))detalle(d.id);if(d.tipo==='poll'&&TAB==='panel'&&!document.activeElement.matches('input,select,textarea'))V.panel()});
</script></body></html>
